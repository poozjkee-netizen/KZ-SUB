# Fly.io конфиг шлюза KZ-SUB (прокси-режим -> Runpod).
# Деплой:  flyctl launch --copy-config --no-deploy   затем   flyctl deploy --remote-only
# Секреты: flyctl secrets set KZSUB_API_KEYS=... KZSUB_RUNPOD_ENDPOINT_ID=... KZSUB_RUNPOD_API_KEY=...
app = "kzsub-gateway"
primary_region = "fra"   # Франкфурт — ближайший крупный регион к KZ

[build]
  dockerfile = "Dockerfile.gateway"

[env]
  KZSUB_STATE_DIR = "/data"

# Постоянный том: привязки ключей к устройствам переживают рестарты.
# Один раз создать: fly volumes create kzsub_data --region fra --size 1 -y
[[mounts]]
  source = "kzsub_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"    # лишние машины при пиках гасятся
  auto_start_machines = true
  min_machines_running = 1        # базовая машина всегда поднята: нет холодного
                                  # старта шлюза + стабильный доступ к консоли/БД

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"   # 512mb OOM-убивало uvicorn на файлах ~28 МБ (см. CHANGELOG)
