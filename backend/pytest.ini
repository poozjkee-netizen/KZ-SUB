[pytest]
# Тесты бэкенда NP SUB. Запуск: cd backend && pytest
#
# Часть тестов dep-free (srt/licenses/segmentation/style/devices) — не требуют
# тяжёлых пакетов. Интеграционный test_api пропускается без fastapi (importorskip).
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -q
