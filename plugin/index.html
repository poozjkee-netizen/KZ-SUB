<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KZ-SUB</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>KZ-SUB</h1>
      <p class="sub">Қазақша авто-субтитр · Premiere Pro</p>
    </header>

    <section class="settings">
      <label class="field">
        <span>API URL</span>
        <div class="row">
          <input id="apiUrl" type="text" value="http://localhost:8000" />
          <button id="test" class="ghost" title="Байланысты тексеру">Тест</button>
        </div>
      </label>

      <label class="field">
        <span>API-кілт (X-API-Key)</span>
        <input id="apiKey" type="password" placeholder="dev-key" />
      </label>

      <label class="field">
        <span>Аудио-пресет (.epr)</span>
        <div class="row">
          <input id="presetPath" type="text" placeholder="Пресет таңдаңыз…" readonly />
          <button id="pickPreset" class="ghost" title="Пресет таңдау">Таңдау</button>
        </div>
      </label>
    </section>

    <button id="run" class="primary">Субтитр жасау</button>

    <div id="status" class="status" aria-live="polite"></div>

    <footer class="footer">
      <div id="quota" class="quota"></div>
    </footer>
  </div>

  <script src="js/CSInterface.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
