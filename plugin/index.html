<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KZ-SUB</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <!-- Brand -->
    <header class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="3"/>
          <path d="M6 14h4M14 14h4M6 10h2M12 10h6"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>KZ-SUB</h1>
        <p>Қазақша авто-субтитр</p>
      </div>
    </header>

    <!-- Hero status card -->
    <section class="hero">
      <div class="hero-glow" aria-hidden="true"></div>
      <div class="hero-row">
        <span class="hero-label">Күй</span>
        <span class="pill">Premiere Pro</span>
      </div>
      <div id="status" class="status">Баптауды толтырып, «Тест» басыңыз</div>
      <div id="quota" class="quota"></div>
    </section>

    <!-- Settings -->
    <section class="settings">
      <label class="field">
        <span class="field-label">API URL</span>
        <div class="row">
          <input id="apiUrl" type="text" value="http://localhost:8000" spellcheck="false" />
          <button id="test" class="btn-ghost" title="Байланысты тексеру">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>
            <span>Тест</span>
          </button>
        </div>
      </label>

      <label class="field">
        <span class="field-label">API-кілт</span>
        <input id="apiKey" type="password" placeholder="dev-key" spellcheck="false" />
      </label>

      <label class="field">
        <span class="field-label">Аудио-пресет (.epr)</span>
        <div class="row">
          <input id="presetPath" type="text" placeholder="Пресет таңдаңыз…" readonly />
          <button id="pickPreset" class="btn-ghost" title="Пресет таңдау">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
            <span>Таңдау</span>
          </button>
        </div>
      </label>
    </section>

    <!-- Primary action -->
    <button id="run" class="btn-primary">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.6L18.5 9.4l-4.7 1.8L12 16l-1.8-4.8L5.5 9.4l4.7-1.8z"/><path d="M19 15l.7 1.8L21.5 17.5l-1.8.7L19 20l-.7-1.8L16.5 17.5l1.8-.7z"/></svg>
      <span>Субтитр жасау</span>
    </button>
  </div>

  <script src="js/CSInterface.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
